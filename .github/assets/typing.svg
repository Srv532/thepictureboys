<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="Cinematic WebGL hero. Custom HLS video player. Scroll-driven kinetic type. Any format in, every browser out.">
  <style>
    text { font: 500 22px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #f2ece3; }
    .p { fill: #ff5a1f; }
  </style>
  <rect x="0.5" y="0.5" width="899" height="63" rx="14" fill="#0a0908" stroke="#2b2620"/>
  <circle cx="26" cy="32" r="5" fill="#ff5a1f"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <defs>
    <clipPath id="k1"><rect x="60" y="0" height="64" width="0"><animate attributeName="width" values="0;0;780;780" keyTimes="0;0.001;0.12;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="k2"><rect x="60" y="0" height="64" width="0"><animate attributeName="width" values="0;0;780;780" keyTimes="0;0.25;0.37;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="k3"><rect x="60" y="0" height="64" width="0"><animate attributeName="width" values="0;0;780;780" keyTimes="0;0.5;0.62;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="k4"><rect x="60" y="0" height="64" width="0"><animate attributeName="width" values="0;0;780;780" keyTimes="0;0.75;0.87;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <g opacity="1" clip-path="url(#k1)"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    <text x="60" y="40"><tspan class="p">~/tpb $</tspan> cinematic WebGL hero, shot on film ▌</text></g>
  <g opacity="0" clip-path="url(#k2)"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    <text x="60" y="40"><tspan class="p">~/tpb $</tspan> custom HLS player · speed · quality ▌</text></g>
  <g opacity="0" clip-path="url(#k3)"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    <text x="60" y="40"><tspan class="p">~/tpb $</tspan> scroll-driven kinetic typography ▌</text></g>
  <g opacity="0" clip-path="url(#k4)"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.75;1" calcMode="discrete" dur="16s" repeatCount="indefinite"/>
    <text x="60" y="40"><tspan class="p">~/tpb $</tspan> any format in · every browser out ▌</text></g>
</svg>
