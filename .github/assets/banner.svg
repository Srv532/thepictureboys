<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="ThePictureBoys — Stories told in frames">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#29b6f6"/>
      <stop offset="0.3" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#9be15d"/>
      <stop offset="0.85" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#29b6f6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;7;3;9;5;2" dur="0.6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
    <clipPath id="wipe"><rect class="wipe" x="0" y="0" width="1200" height="440"/></clipPath>
    <style>
      .blades { transform-origin: 600px 220px; animation: iris 1.5s 1.5s cubic-bezier(.76,0,.24,1) both; }
      .blade { fill: #16130f; stroke: #2b2620; stroke-width: 1.5; }
      .bar { fill: #000; animation: part 1.4s 1.5s cubic-bezier(.16,1,.3,1) forwards; }
      .bar.top { transform-origin: 600px 0; }
      .bar.bottom { transform-origin: 600px 440px; }
      .wipe { transform: scaleX(0); transform-origin: 90px 0; animation: wipe 1.4s 2s cubic-bezier(.16,1,.3,1) forwards; }
      .mark { font: 900 150px Anton, Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif; letter-spacing: -2px; }
      .drip { fill: #4c1d95; transform: scaleY(0); animation: drip 1.6s cubic-bezier(.5,0,.2,1) forwards; }
      .tag { font: italic 400 34px "Instrument Serif", Georgia, "Times New Roman", serif; fill: #f2ece3; opacity: 0; animation: fade 1s 3.2s ease forwards; }
      .eyebrow { font: 600 14px "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: 6px; fill: #9b948a; opacity: 0; animation: fade 1s 2.6s ease forwards; }
      .rec { animation: blink 1s steps(2) infinite; }
      .count { font: 900 120px Impact, "Arial Black", sans-serif; fill: #f2ece3; opacity: 0; }
      .c3, .c2, .c1 { fill: #f2ece3; }
      .c3 { animation: flash .5s .1s both; } .c2 { animation: flash .5s .55s both; } .c1 { animation: flash .5s 1s both; }
      @keyframes iris { 0% { transform: rotate(0) scale(1); opacity: 1; } 70% { opacity: 1; } 100% { transform: rotate(-120deg) scale(6); opacity: 0; } }
      @keyframes part { to { transform: scaleY(0.16); } }
      @keyframes wipe { to { transform: scaleX(1); } }
      @keyframes drip { to { transform: scaleY(1); } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes flash { 0% { opacity: 0; transform: scale(1.4); } 30% { opacity: 1; transform: scale(1); } 90% { opacity: 1; } 100% { opacity: 0; } }
      .count { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01s !important; animation-delay: 0s !important; } }
    </style>
  </defs>

  <rect width="1200" height="440" fill="#0a0908"/>
  <rect width="1200" height="440" fill="url(#glow)"/>


  <!-- wordmark, wiped in like spray paint -->
  <g clip-path="url(#wipe)">
    <text class="mark" x="600" y="262" text-anchor="middle" textLength="1020" lengthAdjust="spacingAndGlyphs" fill="#2e1065" transform="translate(6 8)">ThePictureBoys</text>
    <text class="mark" x="600" y="262" text-anchor="middle" textLength="1020" lengthAdjust="spacingAndGlyphs" fill="url(#paint)" stroke="#6d28d9" stroke-width="7" paint-order="stroke fill">ThePictureBoys</text>
  </g>
  <g>
    <rect class="drip" x="148" y="248" width="9" height="70" rx="4" style="animation-delay:2.6s;transform-origin:152px 248px"/>
    <rect class="drip" x="402" y="250" width="8" height="46" rx="4" style="animation-delay:2.8s;transform-origin:406px 250px"/>
    <rect class="drip" x="611" y="250" width="9" height="84" rx="4" style="animation-delay:3.0s;transform-origin:615px 250px"/>
    <rect class="drip" x="826" y="250" width="8" height="52" rx="4" style="animation-delay:3.1s;transform-origin:830px 250px"/>
    <rect class="drip" x="1024" y="248" width="9" height="74" rx="4" style="animation-delay:3.3s;transform-origin:1028px 248px"/>
  </g>

  <text class="eyebrow" x="600" y="104" text-anchor="middle">PHOTOGRAPHY  ●  VIDEOGRAPHY</text>
  <text class="tag" x="600" y="330" text-anchor="middle">Stories told in frames.</text>

  <!-- aperture -->
  <g class="blades">
    <g transform="translate(600 220)">
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(0)"/>
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(45)"/>
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(90)"/>
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(135)"/>
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(180)"/>
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(225)"/>
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(270)"/>
      <path class="blade" d="M0 -300 L182 -238 L68 -24 L-18 -94 Z" transform="rotate(315)"/>
    </g>
  </g>

  <!-- cinema bars -->
  <rect class="bar top" x="0" y="0" width="1200" height="220"/>
  <rect class="bar bottom" x="0" y="220" width="1200" height="220"/>

  <!-- countdown (over the closed bars) -->
  <text class="count c3" x="600" y="262" text-anchor="middle">3</text>
  <text class="count c2" x="600" y="262" text-anchor="middle">2</text>
  <text class="count c1" x="600" y="262" text-anchor="middle">1</text>

  <!-- camera HUD -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#f2ece3">
    <circle class="rec" cx="1060" cy="404" r="6" fill="#ff2d2d"/>
    <text x="1074" y="409">REC</text>
    <text x="40" y="409" fill="#9b948a">TPB · ROLL 01</text>
    <path d="M30 30 h28 M30 30 v28 M1170 30 h-28 M1170 30 v28 M30 410 h28 M30 410 v-28 M1170 410 h-28 M1170 410 v-28" stroke="#f2ece3" stroke-opacity=".5" stroke-width="2" fill="none"/>
  </g>

  <rect width="1200" height="440" fill="url(#vignette)"/>
  <rect width="1200" height="440" filter="url(#grain)"/>
</svg>
