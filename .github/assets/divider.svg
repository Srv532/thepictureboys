<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-label="film strip divider">
  <defs>
    <pattern id="holes" width="40" height="56" patternUnits="userSpaceOnUse">
      <rect width="40" height="56" fill="#0c0c0c"/>
      <rect x="12" y="6" width="16" height="10" rx="2" fill="#e9e2d6"/>
      <rect x="12" y="40" width="16" height="10" rx="2" fill="#e9e2d6"/>
      <rect x="0" y="20" width="40" height="16" fill="#1a1512"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-40 0" dur="0.6s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="fadeEdges" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="56" fill="url(#fadeEdges)"/></mask>
  </defs>
  <g mask="url(#m)">
    <rect width="1200" height="56" fill="url(#holes)"/>
    <text x="600" y="33" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="6" fill="#ff5a1f">▶ THEPICTUREBOYS · KODAK-ISH 400 · ROLL 01 ◀</text>
  </g>
</svg>
